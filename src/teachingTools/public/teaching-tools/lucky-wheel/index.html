<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸运转盘 · 陈老师教学工具</title>
<link rel="stylesheet" href="/stylesheets/site-theme.css">
<style>
  :root { color-scheme: light; font-family: 'Segoe UI','Microsoft YaHei',sans-serif; color:#194f45; background:#faf8ef; }
  * { box-sizing:border-box; }
  body { margin:0; }
  main { max-width:1168px; margin:auto; padding:28px 24px 48px; }
  a { color:#356e57; text-underline-offset:4px; }
  header { margin:32px 0; }
  .eyebrow { font-size:12px; letter-spacing:3px; font-weight:800; color:#6c806c; }
  h1 { font-size:clamp(32px,5vw,48px); letter-spacing:-1px; margin:10px 0; }
  p { line-height:1.7; color:#65766b; }
  .layout { display:grid; grid-template-columns:340px minmax(0,1fr); gap:24px; align-items:start; }
  .panel { padding:28px; background:#fffef9; border:1px solid #e4e8d9; border-radius:24px; box-shadow:0 8px 32px #194f4508; }
  label { display:block; font-size:20px; font-weight:750; }
  .hint { font-size:14px; margin:8px 0 18px; }
  textarea { display:block; width:100%; min-height:330px; resize:vertical; border:1px solid #ccd8c5; border-radius:14px; padding:16px; background:#fafbf5; color:#194f45; font:inherit; line-height:1.85; }
  textarea:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid #d7ab40; outline-offset:4px; }
  .input-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; }
  #count { margin:8px 0 0; font-size:14px; color:#65766b; text-align:right; }
  button { font:inherit; cursor:pointer; border:0; font-weight:750; }
  #reset { padding:10px 16px; color:#356e57; background:#edf3e6; border-radius:12px; }
  button:disabled { cursor:wait; opacity:.65; }
  .stage { position:relative; text-align:center; padding:24px; }
  #fullscreen { position:absolute; z-index:3; top:16px; right:16px; padding:8px 14px; color:#356e57; background:#edf3e6; border-radius:12px; font-size:14px; }
  /* Fill the screen with the wheel; size it by whichever side is shorter. */
  .stage:fullscreen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; border:0; border-radius:0; background:#faf8ef; }
  .stage:fullscreen .wheel-wrap { width:min(92vw, calc(100vh - 190px)); max-width:none; margin:0 auto; }
  .stage:fullscreen #result { width:min(92vw, 900px); font-size:clamp(20px,3vw,32px); }
  .wheel-wrap { position:relative; max-width:560px; margin:12px auto 0; }
  canvas { display:block; width:100%; height:auto; }
  .pointer { position:absolute; z-index:2; top:0; left:50%; transform:translateX(-50%); width:30px; height:38px; background:#194f45; clip-path:polygon(0 0,100% 0,50% 100%); }
  #spin { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:19%; aspect-ratio:1; border:6px solid #fffef9; border-radius:50%; background:#194f45; color:#fffef9; box-shadow:0 4px 16px #194f4526; font-size:clamp(12px,2vw,18px); }
  #result { min-height:65px; margin:20px 0 0; padding:16px; background:#f1f5e9; border-radius:16px; color:#194f45; font-size:20px; font-weight:750; overflow-wrap:anywhere; }
  .keyboard { font-size:13px; margin:12px 0 0; }
  kbd { font:inherit; padding:2px 7px; border:1px solid #dce3d3; border-radius:5px; background:white; }
  dialog { width:min(620px,calc(100% - 32px)); max-height:calc(100dvh - 48px); overflow:auto; padding:32px; border:1px solid #e4e8d9; border-radius:24px; background:#fffef9; color:#194f45; box-shadow:0 24px 80px #194f4533; text-align:center; }
  dialog::backdrop { background:#143b3573; }
  dialog h2 { margin:0; font-size:18px; }
  #modal-text { margin:24px 0 32px; font-size:clamp(28px,5vw,46px); font-weight:800; line-height:1.5; color:#194f45; overflow-wrap:anywhere; }
  .modal-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .modal-actions button { flex:1 1 180px; padding:14px 20px; border-radius:12px; }
  #keep { background:#194f45; color:#fffef9; }
  #remove { background:#f5e4ac; color:#194f45; }
  #play-again { padding:10px 16px; color:#fffef9; background:#194f45; border-radius:12px; }
  @media(max-width:760px) { main { padding:20px 16px 32px; } header { margin:24px 0; } .layout { grid-template-columns:1fr; } .stage { grid-row:1; padding:16px; } .panel { border-radius:20px; } textarea { min-height:220px; } }
</style>
</head>
<body>
<main>
  <a href="/teaching-tools">← 教学工具</a>
  <header><div class="eyebrow">CHEN LAOSHI · CLASSROOM TOOLS</div><h1>幸运转盘</h1><p>把选择交给一点运气，让每一次课堂互动都有惊喜。</p></header>
  <div class="layout">
    <section class="panel" aria-label="转盘内容">
      <label for="entries">今天，转点什么？</label>
      <p class="hint" id="input-help">每行一个词语或句子，空行自动忽略。修改后，转盘会自动更新。</p>
      <textarea id="entries" aria-describedby="input-help" spellcheck="false">分享一个好消息
请左边的同学回答
用三个词形容今天
全班一起伸个懒腰
问老师一个问题
给同学一句鼓励
再转一次</textarea>
      <p id="count"></p>
      <div class="input-footer"><button id="reset" type="button">重置转盘</button><button id="play-again" type="button">再玩一次</button></div>
      <p class="hint">重置会清除抽取结果，并重新读取上方内容；不会清空你的词句。</p>
    </section>
    <section class="panel stage" aria-label="幸运转盘">
      <button id="fullscreen" type="button" hidden>⛶ 全屏</button>
      <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="1000" height="1000" role="img" aria-label="幸运转盘"></canvas><button id="spin" type="button">开始</button></div>
      <p id="result" role="status" aria-live="polite">准备好了，转一转！</p>
      <p class="keyboard">点击中心按钮，或按 <kbd>SPACE</kbd> 开始</p>
    </section>
  </div>
</main>
<!-- Native dialog provides modal focus trapping and Escape-to-close support. -->
<dialog id="result-modal" aria-labelledby="modal-heading" aria-describedby="modal-text">
  <h2 id="modal-heading">本次抽中</h2>
  <p id="modal-text"></p>
  <div class="modal-actions">
    <button id="keep" type="button" autofocus>保留此问题</button>
    <button id="remove" type="button">移除此问题</button>
  </div>
</dialog>
<script>
(() => {
  'use strict';
  const input = document.getElementById('entries');
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spin = document.getElementById('spin');
  const reset = document.getElementById('reset');
  const playAgain = document.getElementById('play-again');
  const result = document.getElementById('result');
  const count = document.getElementById('count');
  const modal = document.getElementById('result-modal');
  const modalText = document.getElementById('modal-text');
  // Match the language cookie used by the shared site navigation (English by default).
  const isChinese = /(?:^|;\s*)lang=zh(?:;|$)/.test(document.cookie);
  const text = isChinese ? {
    wheel: '幸运转盘', start: '开始', again: '再转', spinning: '旋转中',
    ready: '准备好了，转一转！', empty: '请先输入至少一个词语或句子',
    progress: '好运转动中…', chosen: '本次抽中：', finished: '全部抽完啦！点“再玩一次”从头开始',
    sectors: n => n + ' 个扇形', wheelLabel: n => '幸运转盘，共 ' + n + ' 个扇形',
    fullscreen: '⛶ 全屏', exitFullscreen: '✕ 退出全屏'
  } : {
    wheel: 'Lucky Wheel', start: 'Spin', again: 'Again', spinning: 'Spinning',
    ready: 'Ready? Give it a spin!', empty: 'Enter at least one word or sentence to begin.',
    progress: 'Spinning…', chosen: 'Selected: ', finished: 'All picked! Click “Play again” to start over.',
    sectors: n => n + (n === 1 ? ' sector' : ' sectors'),
    wheelLabel: n => 'Lucky wheel with ' + n + (n === 1 ? ' sector' : ' sectors'),
    fullscreen: '⛶ Full screen', exitFullscreen: '✕ Exit full screen'
  };
  document.documentElement.lang = isChinese ? 'zh-CN' : 'en';
  if (!isChinese) {
    document.title = "Lucky Wheel · Chen Laoshi's Teaching Tools";
    const labels = {
      'main > a': '← Teaching Tools',
      'h1': 'Lucky Wheel',
      'header > p': 'Add a little luck to your classroom. Every spin brings a new surprise.',
      'label[for="entries"]': 'What will you spin today?',
      '#input-help': 'Enter one word or sentence per line. Blank lines are ignored. The wheel updates as you type.',
      '#reset': 'Reset wheel',
      '.input-footer + .hint': 'Reset clears the result and reloads your entries without deleting them.',
      '#modal-heading': 'Selected',
      '#keep': 'Keep this question',
      '#remove': 'Remove this question',
      '#play-again': 'Play again'
    };
    Object.entries(labels).forEach(([selector, value]) => {
      document.querySelector(selector).textContent = value;
    });
    document.querySelector('section.panel').setAttribute('aria-label', 'Wheel entries');
    document.querySelector('.stage').setAttribute('aria-label', text.wheel);
    const keyboard = document.querySelector('.keyboard');
    keyboard.firstChild.textContent = 'Click the center button or press ';
    keyboard.lastChild.textContent = ' to spin';
    input.value = [
      'Share some good news', 'Ask the classmate on your left',
      'Describe today in three words', 'Everyone take a stretch break',
      'Ask your teacher a question', 'Encourage a classmate', 'Spin again'
    ].join('\n');
  }
  const colors = ['#f3d879','#c5d9b0','#f2c9b6','#dce7c6','#e9deb5','#bcd7cb','#f5e4ac'];
  const TAU = Math.PI * 2;
  let items = [], rotation = 0, selected = -1, running = false, frame = 0;

  // Measure each character so Chinese text and unbroken English words both wrap.
  function wrap(text, width) {
    const lines = [];
    let line = '';
    for (const character of Array.from(text)) {
      if (line && ctx.measureText(line + character).width > width) {
        lines.push(line);
        line = '';
      }
      line += character;
    }
    if (line) lines.push(line);
    return lines;
  }

  function draw() {
    ctx.clearRect(0, 0, 1000, 1000);
    const radius = 464, step = TAU / (items.length || 1);
    ctx.save();
    ctx.translate(500, 500);
    if (!items.length) {
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, TAU);
      ctx.fillStyle = '#edf3e6'; ctx.fill();
    }
    items.forEach((text, index) => {
      const middle = rotation - Math.PI / 2 + index * step;
      const start = middle - step / 2, end = middle + step / 2;
      ctx.save();
      ctx.beginPath();
      if (items.length === 1) ctx.arc(0, 0, radius, 0, TAU);
      else { ctx.moveTo(0, 0); ctx.arc(0, 0, radius, start, end); ctx.closePath(); }
      ctx.fillStyle = index === selected ? '#f7bf3c' : colors[index % colors.length];
      ctx.fill();
      ctx.strokeStyle = index === selected ? '#194f45' : '#fffef9';
      ctx.lineWidth = index === selected ? 9 : 3;
      ctx.stroke();
      // Clip as a final guard; the text box itself fits inside the sector.
      ctx.clip();
      ctx.rotate(middle);
      ctx.translate(radius * .61, 0);
      if (Math.cos(middle) < 0) ctx.rotate(Math.PI);
      const width = radius * .48;
      const height = items.length <= 2 ? radius * .48 : Math.min(radius * .48, 2 * radius * .35 * Math.tan(step / 2)) * .84;
      let size = 30, lines;
      // Fit all lines without truncating the original entry.
      do {
        ctx.font = '700 ' + size + 'px "Segoe UI","Microsoft YaHei",sans-serif';
        lines = wrap(text, width);
        if (lines.length * size * 1.25 <= height && lines.every(line => ctx.measureText(line).width <= width)) break;
        size *= .9;
      } while (size > .1);
      ctx.fillStyle = '#194f45'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      lines.forEach((line, row) => ctx.fillText(line, 0, (row - (lines.length - 1) / 2) * size * 1.25));
      ctx.restore();
    });
    ctx.beginPath(); ctx.arc(0, 0, radius + 3, 0, TAU);
    ctx.strokeStyle = '#194f45'; ctx.lineWidth = 7; ctx.stroke();
    ctx.restore();
  }

  function reload() {
    if (modal.open) modal.close();
    cancelAnimationFrame(frame);
    running = false; rotation = 0; selected = -1;
    items = input.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    count.textContent = text.sectors(items.length);
    canvas.setAttribute('aria-label', text.wheelLabel(items.length));
    input.disabled = false; spin.disabled = playAgain.disabled = !items.length; spin.textContent = text.start;
    result.textContent = items.length ? text.ready : text.empty;
    draw();
  }

  function start() {
    if (running || modal.open || !items.length) return;
    running = true; selected = -1; spin.disabled = playAgain.disabled = true; input.disabled = true;
    spin.textContent = text.spinning; result.textContent = text.progress;
    // Rejection sampling gives every sector the same chance, even with duplicates.
    const random = new Uint32Array(1), limit = 4294967296 - (4294967296 % items.length);
    do { crypto.getRandomValues(random); } while (random[0] >= limit);
    const winner = random[0] % items.length;
    const from = rotation, target = (TAU - winner * TAU / items.length) % TAU;
    const distance = TAU * 5 + ((target - from % TAU + TAU) % TAU);
    const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 4200;
    const began = performance.now();
    function tick(now) {
      const progress = Math.min(1, (now - began) / duration);
      rotation = from + distance * (1 - Math.pow(1 - progress, 4));
      if (progress === 1) {
        rotation = target; selected = winner; running = false;
        input.disabled = false; spin.disabled = playAgain.disabled = false; spin.textContent = text.again;
        result.textContent = text.chosen + items[winner];
      }
      draw();
      if (progress === 1) {
        modalText.textContent = items[winner];
        modal.showModal();
      }
      if (progress < 1) frame = requestAnimationFrame(tick);
    }
    frame = requestAnimationFrame(tick);
  }
  spin.addEventListener('click', start);
  reset.addEventListener('click', reload);
  input.addEventListener('input', reload);
  document.getElementById('keep').addEventListener('click', () => modal.close());
  // Full screen shows only the wheel panel; Safari on iPad still needs the webkit prefix.
  const stage = document.querySelector('.stage');
  const fullscreen = document.getElementById('fullscreen');
  const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  function updateFullscreen() {
    fullscreen.textContent = fullscreenElement() ? text.exitFullscreen : text.fullscreen;
  }
  if (stage.requestFullscreen || stage.webkitRequestFullscreen) {
    fullscreen.hidden = false;
    updateFullscreen();
    fullscreen.addEventListener('click', () => {
      if (fullscreenElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
    });
    document.addEventListener('fullscreenchange', updateFullscreen);
    document.addEventListener('webkitfullscreenchange', updateFullscreen);
  }
  // Bring back every entry from the text box, then spin from the start.
  playAgain.addEventListener('click', () => {
    reload();
    start();
  });
  document.getElementById('remove').addEventListener('click', () => {
    // Remove by index so identical entries remain separate choices.
    // Only the wheel changes; the text box keeps every entry for the next round.
    items.splice(selected, 1);
    selected = -1;
    modal.close();
    count.textContent = text.sectors(items.length);
    canvas.setAttribute('aria-label', text.wheelLabel(items.length));
    spin.disabled = !items.length;
    if (!items.length) result.textContent = text.finished;
    draw();
  });
  document.addEventListener('keydown', event => {
    // Preserve normal typing and native Space activation on focused buttons.
    if (event.code !== 'Space' || event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.target.closest('textarea,input,button,a,[contenteditable]')) return;
    event.preventDefault(); start();
  });
  reload();
})();
</script>
<!-- Use the same shared navigation and footer as the other teaching tools. -->
<script src="/javascripts/milk-tea-footer.js"></script>
</body>
</html>
